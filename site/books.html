<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词书管理</title><link rel="stylesheet" href="assets/app.css"></head>
<body><main class="container library"><header><h1>词书管理</h1><a href="index.html">返回拼写训练</a></header>
<section><h2>我的词书</h2><p>词书进度独立保存，生词本和学习日历由当前用户共享。</p><div id="bookList"></div></section>
<section><h2>导入词书</h2><p>支持 UTF-8 CSV、TSV 和 JSON。单词、释义必填，其余字段可选。</p>
<div class="library-actions"><button id="templateBtn" type="button">下载 CSV 模板</button><label>选择文件 <input id="bookFile" type="file" accept=".csv,.tsv,.json"></label></div>
<div id="importForm" hidden><label>词书名称 <input id="bookName" maxlength="100"></label><label>导入方式 <select id="importTarget"><option value="">新建词书</option></select></label>
<div class="library-fields" id="fieldMap"></div><button id="previewBtn" type="button">预览转换结果</button><div id="importPreview"></div><button id="importBtn" class="primary" type="button" disabled>确认导入</button></div></section>
<section><h2>备份与恢复</h2><p>备份包含本机全部用户的词书、进度和生词本。恢复会覆盖备份中同名的数据项。</p><div class="library-actions"><button id="backupBtn" type="button">导出完整备份</button><label>恢复备份 <input id="backupFile" type="file" accept=".json"></label></div></section>
<p id="libraryStatus" role="status" aria-live="polite"></p></main>
<script src="assets/core.js"></script><script src="assets/books.js"></script><script src="assets/library.js"></script></body></html>
